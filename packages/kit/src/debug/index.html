<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自建源 · 调试</title>
<style>
  :root { color-scheme: light dark; --line: #8884; --muted: #888; --accent: #1f9d55; --bad: #d33; --card: #8881; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
  header { padding: 12px 20px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  .muted { color: var(--muted); }
  .layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 54px); }
  aside { border-right: 1px solid var(--line); padding: 12px; }
  main { padding: 12px 20px; min-width: 0; }
  .source { border: 1px solid var(--line); border-radius: 8px; padding: 10px; margin-bottom: 10px; cursor: pointer; }
  .source.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .source .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .source img { width: 24px; height: 24px; border-radius: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--accent); }
  .dot.degraded, .dot.starting { background: orange; } .dot.broken { background: var(--bad); }
  button { font: inherit; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  input, select, textarea { font: inherit; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: transparent; }
  textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  nav.tabs button { border: none; background: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 12px; }
  nav.tabs button.on { border-bottom-color: var(--accent); font-weight: 600; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chips button.on { background: var(--accent); color: white; }
  .section h3 { margin: 16px 0 8px; font-size: 15px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .card { cursor: pointer; border-radius: 8px; overflow: hidden; background: var(--card); }
  .card .pic { aspect-ratio: 16 / 9; background: #8883 center / cover no-repeat; position: relative; }
  .card .pic .badge { position: absolute; top: 4px; right: 4px; font-size: 11px; padding: 0 4px; border-radius: 3px; background: #c33; color: white; }
  .card .pic .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--accent); }
  .card .t { padding: 6px 8px 0; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .s { padding: 0 8px 6px; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { display: grid; grid-template-columns: 200px 1fr; gap: 16px; margin-bottom: 12px; }
  .detail img { width: 100%; border-radius: 8px; }
  .detail p { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 9em; overflow: auto; }
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: none; border-bottom: 1px solid var(--line); }
    .detail { grid-template-columns: 1fr; }
    .detail img { max-width: 320px; }
  }
  .episodes { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  video { width: 100%; max-height: 60vh; background: black; border-radius: 8px; }
  details { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  details summary { cursor: pointer; color: var(--muted); }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 12px; max-height: 50vh; overflow: auto; margin: 6px 0 0; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  td, th { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
  .error { color: var(--bad); white-space: pre-wrap; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; min-width: 320px; max-width: 90vw; }
  dialog img { display: block; margin: 8px auto; background: white; padding: 8px; border-radius: 8px; }
  .streams td button { padding: 0 6px; }
</style>
</head>
<body>
<header>
  <h1 id="serverName">自建源</h1>
  <span class="muted" id="serverMeta"></span>
  <span style="flex:1"></span>
  <button onclick="loadManifest()">刷新</button>
</header>
<div class="layout">
  <aside>
    <div id="sources"></div>
    <details><summary>manifest</summary><pre id="manifestJSON"></pre></details>
  </aside>
  <main>
    <nav class="tabs" id="tabs"></nav>
    <div id="panel"></div>
    <div id="error" class="error"></div>
    <details id="lastBox"><summary id="lastSummary">最近一次响应</summary><pre id="lastJSON"></pre></details>
  </main>
</div>

<dialog id="loginDialog">
  <h3 id="loginTitle">登录</h3>
  <div id="loginBody"></div>
  <div class="row" style="justify-content:flex-end"><button onclick="cancelLogin()">关闭</button></div>
</dialog>

<script>
const BASE = '/iyt/v1'
const state = { manifest: null, source: null, tab: 'browse', channels: null, channel: null, login: null, hls: null, progressTimer: null }

// MARK: 工具

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag)
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue
    if (key.startsWith('on')) el.addEventListener(key.slice(2), value)
    else if (key === 'style' && typeof value === 'object') Object.assign(el.style, value)
    else if (key === 'class') el.className = value
    else el.setAttribute(key, value === true ? '' : value)
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== false) el.append(child instanceof Node ? child : String(child))
  return el
}

function src(path) { return `${BASE}/sources/${state.source.id}/${path}` }

async function api(path, { method = 'GET', body, quiet } = {}) {
  const started = performance.now()
  const response = await fetch(path, {
    method,
    headers: body !== undefined ? { 'content-type': 'application/json' } : {},
    body: body !== undefined ? JSON.stringify(body) : undefined,
  })
  const ms = Math.round(performance.now() - started)
  const text = await response.text()
  let data = null
  try { data = text ? JSON.parse(text) : null } catch { data = text }
  if (!quiet) {
    document.getElementById('lastSummary').textContent = `最近一次响应：${method} ${path} → ${response.status}（${ms} ms）`
    document.getElementById('lastJSON').textContent = typeof data === 'string' ? data : JSON.stringify(data, null, 2)
  }
  if (!response.ok) {
    const message = data && data.error ? `${data.error.code}：${data.error.message}` : `HTTP ${response.status}`
    throw new Error(message)
  }
  return data
}

function showError(error) { document.getElementById('error').textContent = error ? String(error.message || error) : '' }
async function guarded(run) { showError(null); try { await run() } catch (error) { showError(error) } }
function qs(params) { return new URLSearchParams(Object.entries(params).filter(([, v]) => v !== undefined && v !== null && v !== '')).toString() }
function fmtTime(seconds) { if (seconds == null) return ''; const s = Math.round(seconds); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` }
function targetOf(item) { return item.target.show !== undefined ? `show:${item.target.show}` : `video:${item.target.video}` }

// MARK: Manifest 与源

async function loadManifest() {
  await guarded(async () => {
    const manifest = await api(`${BASE}/manifest`, { quiet: true })
    state.manifest = manifest
    document.getElementById('serverName').textContent = manifest.server.name
    const components = Object.entries(manifest.server.components || {}).map(([k, v]) => `${k} ${v}`).join(' · ')
    document.getElementById('serverMeta').textContent = `协议 v${manifest.protocol} · ${manifest.server.software} ${manifest.server.version}${components ? ' · ' + components : ''} · ${manifest.server.id}`
    document.getElementById('manifestJSON').textContent = JSON.stringify(manifest, null, 2)
    if (!state.source || !manifest.sources.find((s) => s.id === state.source.id)) state.source = manifest.sources[0] || null
    else state.source = manifest.sources.find((s) => s.id === state.source.id)
    renderSources()
    renderTabs()
  })
}

function renderSources() {
  const list = document.getElementById('sources')
  list.replaceChildren(...state.manifest.sources.map((source) => {
    const account = source.account
    const login = account.login.length === 0
      ? h('div', { class: 'muted' }, '无需登录')
      : account.loggedIn
        ? h('div', {}, `已登录：${account.profile?.name ?? ''} `, h('button', { onclick: (e) => { e.stopPropagation(); logout(source) } }, '退出'))
        : h('div', {}, h('span', { class: 'muted' }, `未登录（${account.requiredFor === 'nothing' ? '可选' : account.requiredFor === 'play' ? '播放需要' : '必须'}）`), ' ',
            ...account.login.map((method) => h('button', { onclick: (e) => { e.stopPropagation(); startLogin(source, method) } }, methodName(method))))
    return h('div', { class: `source${state.source && state.source.id === source.id ? ' active' : ''}`, onclick: () => selectSource(source) },
      h('div', { class: 'name' }, source.brand.logo ? h('img', { src: source.brand.logo }) : null, source.name,
        h('span', { class: `dot ${source.status.state}`, title: source.status.state })),
      source.status.message ? h('div', { class: 'muted' }, source.status.message) : null,
      h('div', { class: 'muted' }, `id: ${source.id}`),
      login)
  }))
  if (state.manifest.sources.length === 0) list.append(h('div', { class: 'muted' }, '配置里没有源'))
}

function methodName(method) { return { qr: '扫码登录', deviceCode: '设备码登录', webCookie: '导入 Cookie' }[method] || method }

function selectSource(source) {
  state.source = source
  state.channels = null
  state.channel = null
  renderSources()
  renderTabs()
}

// MARK: Tab

const TABS = [
  ['browse', '浏览'], ['search', '搜索'], ['history', '历史'], ['player', '播放'], ['console', '接口'], ['log', '请求日志'],
]

function renderTabs() {
  const nav = document.getElementById('tabs')
  nav.replaceChildren(...TABS.map(([id, title]) => h('button', { class: state.tab === id ? 'on' : '', onclick: () => { state.tab = id; renderTabs() } }, title)))
  const panel = document.getElementById('panel')
  panel.replaceChildren()
  if (!state.source && state.tab !== 'log' && state.tab !== 'console') { panel.append(h('p', { class: 'muted' }, '没有源')); return }
  ;({ browse: renderBrowse, search: renderSearch, history: renderHistory, player: renderPlayerTab, console: renderConsole, log: renderLog })[state.tab](panel)
}

// MARK: 浏览

function renderBrowse(panel) {
  const chips = h('div', { class: 'chips' })
  const content = h('div')
  panel.append(chips, content)
  guarded(async () => {
    if (!state.channels) state.channels = await api(src('feed/channels'))
    const all = [state.channels.home, ...state.channels.channels.filter((c) => c.id !== state.channels.home.id),
      ...state.channels.library.map((shelf) => ({ ...shelf.channel, title: `📚 ${shelf.channel.title}` }))]
    if (!state.channel) state.channel = all[0]
    chips.replaceChildren(...all.map((channel) => h('button', {
      class: state.channel && state.channel.id === channel.id ? 'on' : '',
      onclick: () => { state.channel = channel; renderTabs() },
    }, channel.title)))
    await loadFeed(content, state.channel.id)
  })
}

async function loadFeed(content, id, cursor) {
  const page = await api(src(`feed/channel?${qs({ id, cursor })}`))
  for (const section of page.sections) {
    const box = h('div', { class: 'section' }, h('h3', {}, section.title || '', ' ', h('span', { class: 'muted' }, section.style)))
    box.append(cards(section.items))
    if (section.more) box.append(h('button', { onclick: () => guarded(() => loadMore(box, section.more)) }, `${section.more.title} ›`))
    content.append(box)
  }
  if (page.next) {
    const button = h('button', { onclick: () => guarded(async () => { button.remove(); await loadFeed(content, id, page.next) }) }, '下一页')
    content.append(button)
  }
}

async function loadMore(box, more, cursor) {
  const page = await api(src(`feed/more?${qs({ route: more.route, cursor })}`))
  box.append(cards(page.items))
  if (page.next) {
    const button = h('button', { onclick: () => guarded(async () => { button.remove(); await loadMore(box, more, page.next) }) }, '更多')
    box.append(button)
  }
}

function cards(items) {
  return h('div', { class: 'cards' }, items.map((item) => h('div', { class: 'card', onclick: () => openDetail(targetOf(item)) },
    h('div', { class: 'pic', style: { backgroundImage: item.landscapeURL || item.posterURL ? `url("${item.landscapeURL || item.posterURL}")` : 'none' } },
      item.badge ? h('span', { class: 'badge' }, item.badge.text) : null,
      item.progress ? h('div', { class: 'bar', style: { width: `${Math.round(item.progress * 100)}%` } }) : null),
    h('div', { class: 't', title: item.title }, item.rank ? `${item.rank}. ` : '', item.title),
    h('div', { class: 's' }, [item.caption, item.subtitle, item.duration ? fmtTime(item.duration) : null].filter(Boolean).join(' · ') || ' '))))
}

// MARK: 详情

async function openDetail(target) {
  state.tab = 'player'
  state.detailTarget = target
  state.detail = null
  state.media = null
  renderTabs()
}

function renderPlayerTab(panel) {
  if (!state.detailTarget) { panel.append(h('p', { class: 'muted' }, '在「浏览」「搜索」「历史」里点一个条目。')); return }
  const top = h('div')
  const player = h('div')
  panel.append(top, player)
  guarded(async () => {
    if (!state.detail) state.detail = await api(src(`detail?${qs({ target: state.detailTarget })}`))
    const d = state.detail
    const episodeButtons = (list) => list ? h('div', {},
      list.summary ? h('div', { class: 'muted' }, list.summary) : null,
      list.ranges && list.ranges.length ? h('div', { class: 'chips' }, list.ranges.map((range) => h('button', {
        onclick: () => guarded(async () => { const next = await api(src(`detail/episodes?${qs({ cursor: range.cursor })}`)); state.detail = { ...state.detail, episodes: next }; renderTabs() }),
      }, range.title))) : null,
      h('div', { class: 'episodes' }, list.episodes.map((episode) => h('button', {
        class: state.media && state.playing === episode.id ? 'primary' : '',
        title: episode.title,
        onclick: () => guarded(() => resolve(player, episode.id, d.showID)),
      }, `${episode.stage} ${episode.title}`.slice(0, 40))))) : null
    top.replaceChildren(...[
      h('div', { class: 'detail' },
        d.posterURL || d.landscapeURL ? h('img', { src: d.posterURL || d.landscapeURL }) : h('div'),
        h('div', {},
          h('h2', { style: { margin: '0 0 4px' } }, d.title),
          h('div', { class: 'muted' }, [d.category, d.attributes, d.updateInfo, d.kind].filter(Boolean).join(' · ')),
          d.summary || d.shortSummary ? h('p', {}, d.summary || d.shortSummary) : null,
          h('div', { class: 'row' },
            d.defaultVideoID ? h('button', { class: 'primary', onclick: () => guarded(() => resolve(player, d.resume?.videoID || d.defaultVideoID, d.showID)) }, d.resume ? `继续播放（${Math.round((d.resume.progress || 0) * 100)}%）` : '播放') : null,
            h('span', { class: 'muted' }, `target ${state.detailTarget}`)))),
      episodeButtons(d.episodes),
      d.recommendations && d.recommendations.items.length ? h('div', { class: 'section' }, h('h3', {}, '推荐'), cards(d.recommendations.items)) : null,
      h('details', {}, h('summary', {}, '详情 JSON'), h('pre', {}, JSON.stringify(d, null, 2)))].filter(Boolean))
    if (state.media) renderMedia(player)
  })
}

// MARK: 播放

async function resolve(player, video, show) {
  stopPlayback()
  state.playing = video
  state.playingShow = show
  const quality = document.getElementById('maxQuality')?.value
  state.media = await api(src('playback/resolve'), { method: 'POST', body: { video, show: show || null, preferences: { maxQualityRank: quality ? Number(quality) : null } } })
  state.stream = state.media.selectedStream
  renderMedia(player)
}

function renderMedia(player) {
  const media = state.media
  const stream = media.streams.find((s) => s.id === state.stream) || media.streams[0]
  const video = h('video', { controls: true, playsinline: true })
  const report = h('input', { type: 'checkbox', id: 'report' })
  player.replaceChildren(...[
    h('h3', {}, media.title, media.live ? '（直播）' : ''),
    h('div', { class: 'row' },
      '最高清晰度', h('select', { id: 'maxQuality' }, h('option', { value: '' }, '不限'), ...[2160, 1440, 1080, 720, 480, 360].map((rank) => h('option', { value: rank }, rank))),
      h('label', {}, report, ' 上报进度'),
      media.expiresAt ? h('span', { class: 'muted' }, `地址到期 ${new Date(media.expiresAt).toLocaleString()}`) : null,
      media.startPosition ? h('span', { class: 'muted' }, `从 ${fmtTime(media.startPosition)} 开始`) : null),
    video,
    h('table', { class: 'streams' }, h('tr', {}, h('th', {}, ''), h('th', {}, 'id'), h('th', {}, '清晰度'), h('th', {}, '语言'), h('th', {}, '格式'), h('th', {}, '说明')),
      media.streams.map((s) => h('tr', {},
        h('td', {}, s.unavailableReason ? h('span', { class: 'muted' }, s.unavailableReason) : h('button', { class: s.id === stream.id ? 'primary' : '', onclick: () => { state.stream = s.id; renderMedia(player) } }, '播放')),
        h('td', {}, s.id), h('td', {}, s.quality.label), h('td', {}, s.language?.name || ''), h('td', {}, s.format), h('td', {}, h('a', { href: s.url, target: '_blank' }, s.description))))),
    media.subtitles && media.subtitles.length ? h('div', { class: 'row' }, '字幕原文：', media.subtitles.map((sub) => h('button', {
      onclick: () => guarded(async () => { const data = await api(sub.cues); alert(`${sub.name}：${data.cues.length} 句\n\n` + data.cues.slice(0, 8).map((c) => `${fmtTime(c.start)} ${c.text}`).join('\n')) }),
      disabled: !sub.cues,
    }, sub.name))) : null,
    h('details', {}, h('summary', {}, '解析结果 JSON'), h('pre', {}, JSON.stringify(media, null, 2)))].filter(Boolean))
  play(video, stream, media)
  const send = (event) => {
    if (!report.checked) return
    api(src('playback/progress'), { method: 'POST', quiet: true, body: {
      event, video: state.playing, show: state.playingShow || null, position: video.currentTime,
      duration: Number.isFinite(video.duration) ? video.duration : null, reportContext: media.reportContext,
    } }).catch(showError)
  }
  video.addEventListener('playing', () => send('start'), { once: true })
  video.addEventListener('seeked', () => send('seek'))
  video.addEventListener('pause', () => send('leave'))
  video.addEventListener('ended', () => send('end'))
  state.progressTimer = setInterval(() => { if (!video.paused) send('progress') }, 15000)
}

function play(video, stream, media) {
  const start = () => { if (media.startPosition) video.currentTime = media.startPosition; video.play().catch(() => {}) }
  video.addEventListener('loadedmetadata', start, { once: true })
  if (stream.format === 'hls' && !video.canPlayType('application/vnd.apple.mpegurl') && window.Hls && window.Hls.isSupported()) {
    state.hls = new window.Hls()
    state.hls.on(window.Hls.Events.ERROR, (_, data) => { if (data.fatal) showError(`hls.js：${data.type} ${data.details}`) })
    state.hls.loadSource(stream.url)
    state.hls.attachMedia(video)
  } else {
    video.src = stream.url
  }
}

function stopPlayback() {
  if (state.hls) { state.hls.destroy(); state.hls = null }
  if (state.progressTimer) { clearInterval(state.progressTimer); state.progressTimer = null }
}

// MARK: 搜索

function renderSearch(panel) {
  const features = state.source.features.search
  if (!features) { panel.append(h('p', { class: 'muted' }, '这个源没有搜索')); return }
  const input = h('input', { placeholder: features.prompt || '搜索', list: 'suggestions', style: { width: '320px' } })
  const datalist = h('datalist', { id: 'suggestions' })
  const results = h('div')
  const run = () => guarded(async () => {
    results.replaceChildren()
    const data = await api(src(`search?${qs({ q: input.value })}`))
    if (data.topMatch) results.append(h('div', { class: 'section' }, h('h3', {}, '最佳匹配'), cards([data.topMatch.show])))
    if (data.shows.length) results.append(h('div', { class: 'section' }, h('h3', {}, '节目'), cards(data.shows)))
    if (data.videos.length) results.append(h('div', { class: 'section' }, h('h3', {}, '视频'), cards(data.videos)))
    if (!data.topMatch && !data.shows.length && !data.videos.length) results.append(h('p', { class: 'muted' }, '没有结果'))
  })
  let timer
  input.addEventListener('input', () => {
    if (!features.suggestions) return
    clearTimeout(timer)
    timer = setTimeout(() => api(src(`search/suggestions?${qs({ q: input.value })}`), { quiet: true })
      .then((list) => datalist.replaceChildren(...list.map((s) => h('option', { value: s.keyword }, s.detail || s.tag || ''))))
      .catch(() => {}), 200)
  })
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') run() })
  panel.append(h('div', { class: 'row' }, input, datalist, h('button', { class: 'primary', onclick: run }, '搜索')), results)
  if (features.rankings) guarded(async () => {
    const rankings = await api(src('search/rankings'), { quiet: true })
    for (const ranking of rankings) results.append(h('div', { class: 'section' }, h('h3', {}, ranking.title), cards(ranking.items)))
  })
}

// MARK: 历史

function renderHistory(panel) {
  if (!state.source.features.history) { panel.append(h('p', { class: 'muted' }, '这个源没有观看历史')); return }
  const list = h('div', { class: 'cards' })
  const more = h('div')
  panel.append(list, more)
  const load = (page) => guarded(async () => {
    const data = await api(src(`history?${qs({ page })}`))
    list.append(...data.items.map((item) => h('div', { class: 'card', onclick: () => openDetail(item.showID ? `show:${item.showID}` : `video:${item.id}`) },
      h('div', { class: 'pic', style: { backgroundImage: item.coverURL ? `url("${item.coverURL}")` : 'none' } },
        item.progress ? h('div', { class: 'bar', style: { width: `${Math.round(item.progress * 100)}%` } }) : null),
      h('div', { class: 't' }, item.title),
      h('div', { class: 's' }, [item.lastWatched ? new Date(item.lastWatched).toLocaleString() : null, item.device?.name].filter(Boolean).join(' · ') || ' '),
      state.source.features.history.delete && item.historyKey ? h('div', { class: 's' }, h('button', {
        onclick: (e) => { e.stopPropagation(); guarded(async () => { await api(src('history/delete'), { method: 'POST', body: { keys: [item.historyKey] } }); renderTabs() }) },
      }, '删除')) : null)))
    more.replaceChildren(data.hasMore ? h('button', { onclick: () => load(page + 1) }, '下一页') : '')
  })
  load(1)
}

// MARK: 接口控制台

function renderConsole(panel) {
  const prefix = state.source ? `${BASE}/sources/${state.source.id}/` : `${BASE}/`
  const method = h('select', {}, h('option', {}, 'GET'), h('option', {}, 'POST'))
  const path = h('input', { value: `${prefix}feed/channels`, style: { flex: '1', minWidth: '320px' } })
  const body = h('textarea', { rows: 6, placeholder: 'POST 的 JSON 体' })
  const output = h('pre')
  const send = () => guarded(async () => {
    const started = performance.now()
    try {
      const data = await api(path.value, { method: method.value, body: method.value === 'POST' ? JSON.parse(body.value || '{}') : undefined })
      output.textContent = `${Math.round(performance.now() - started)} ms\n\n${JSON.stringify(data, null, 2)}`
    } catch (error) { output.textContent = String(error.message || error) }
  })
  const examples = ['manifest', 'feed/channels', 'search?q=', 'detail?target=show:', 'history?page=1']
  panel.append(
    h('div', { class: 'row' }, method, path, h('button', { class: 'primary', onclick: send }, '发送')),
    h('div', { class: 'chips' }, examples.map((e) => h('button', { onclick: () => { path.value = e === 'manifest' ? `${BASE}/manifest` : prefix + e } }, e))),
    body, output)
}

// MARK: 请求日志

function renderLog(panel) {
  const table = h('table')
  panel.append(h('div', { class: 'row' }, h('span', { class: 'muted' }, '最近 300 条，每 3 秒刷新（调试页自己的请求不记）')), table)
  const refresh = async () => {
    if (state.tab !== 'log') return
    const records = await api('/debug/api/log', { quiet: true }).catch(() => [])
    table.replaceChildren(h('tr', {}, ['时间', '方法', '路径', '状态', '耗时', '错误', '对端'].map((t) => h('th', {}, t))),
      ...records.map((r) => h('tr', {},
        h('td', {}, new Date(r.at).toLocaleTimeString()), h('td', {}, r.method), h('td', {}, r.path),
        h('td', { style: { color: r.status >= 400 ? 'var(--bad)' : '' } }, r.status), h('td', {}, `${r.ms} ms`),
        h('td', {}, r.errorCode ? `${r.errorCode}：${r.errorMessage}` : ''), h('td', { class: 'muted' }, r.peer || ''))))
    setTimeout(refresh, 3000)
  }
  refresh()
}

// MARK: 登录

async function startLogin(source, method) {
  state.source = source
  const dialog = document.getElementById('loginDialog')
  const bodyEl = document.getElementById('loginBody')
  document.getElementById('loginTitle').textContent = `${source.name} · ${methodName(method)}`
  dialog.showModal()
  if (method === 'webCookie') {
    const area = h('textarea', { rows: 8, placeholder: '[{"name":"SID","value":"…","domain":".example.com"}]' })
    bodyEl.replaceChildren(
      h('p', { class: 'muted' }, 'App 里会打开登录网页自动完成；这里可粘贴 cookie JSON 调试。', source.account.webLogin ? h('br') : null,
        source.account.webLogin ? `登录页：${source.account.webLogin.url}` : null),
      area,
      h('div', { class: 'row' }, h('button', { class: 'primary', onclick: () => guarded(async () => {
        const result = await api(`${BASE}/sources/${source.id}/login/cookie`, { method: 'POST', body: { cookies: JSON.parse(area.value), userAgent: navigator.userAgent } })
        bodyEl.replaceChildren(h('p', {}, result.step.kind === 'completed' ? `已登录：${result.step.profile.name}` : result.step.message))
        loadManifest()
      }) }, '提交')))
    return
  }
  bodyEl.replaceChildren(h('p', { class: 'muted' }, '正在开始…'))
  try {
    let current = await api(`${BASE}/sources/${source.id}/login/start`, { method: 'POST', body: { method } })
    state.login = { source, id: current.loginId }
    while (state.login && state.login.id === current.loginId) {
      renderLoginStep(bodyEl, current.step)
      if (current.step.kind === 'completed' || current.step.kind === 'failed') { if (current.step.kind === 'completed') loadManifest(); break }
      current = await api(`${BASE}/sources/${source.id}/login/${current.loginId}?${qs({ after: current.seq, wait: 25 })}`, { quiet: true })
    }
  } catch (error) {
    bodyEl.replaceChildren(h('p', { class: 'error' }, String(error.message || error)))
  }
}

function renderLoginStep(bodyEl, step) {
  switch (step.kind) {
    case 'showCode':
      bodyEl.replaceChildren(...[h('p', {}, step.title), h('img', { src: `/debug/api/qr?${qs({ text: step.content })}`, width: 240, height: 240 }),
        h('p', {}, step.message), step.openURL ? h('p', {}, h('a', { href: step.openURL, target: '_blank' }, step.openURL)) : null,
        step.expiresAt ? h('p', { class: 'muted' }, `到期 ${new Date(step.expiresAt).toLocaleTimeString()}`) : null].filter(Boolean))
      break
    case 'waiting': bodyEl.replaceChildren(h('p', {}, step.message)); break
    case 'completed': bodyEl.replaceChildren(h('p', {}, `已登录：${step.profile.name}`)); break
    case 'failed': bodyEl.replaceChildren(h('p', { class: 'error' }, step.message)); break
  }
}

function cancelLogin() {
  const login = state.login
  state.login = null
  if (login) api(`${BASE}/sources/${login.source.id}/login/${login.id}/cancel`, { method: 'POST', body: {}, quiet: true }).catch(() => {})
  document.getElementById('loginDialog').close()
}

async function logout(source) {
  if (!confirm(`退出 ${source.name} 的账号？所有连这个服务的设备都会退出。`)) return
  await guarded(async () => { await api(`${BASE}/sources/${source.id}/account/logout`, { method: 'POST', body: {} }); await loadManifest() })
}

loadManifest()
